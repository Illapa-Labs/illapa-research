[project]
name = "illapa-research"
version = "0.1.0"
description = "Kit de investigación de Illapa Labs: descarga de datos, notebooks y modelos para el clima y los peligros naturales en el Perú."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "networkx>=3.3",
    "shapely>=2.0",
    "geopandas>=1.0",
    "matplotlib>=3.9",
    "pysheds>=0.5",
    "rasterio>=1.4.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
    "xarray>=2026.9.0",
    "netcdf4>=1.7.5.1.post1",
    "truststore>=0.9",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbformat>=5"]
dev = ["pytest>=8", "ruff>=0.6"]
hf = [
    "huggingface-hub>=0.25",
]
gpu = [
    "torch>=2.4",
]
satelite = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
]
era5 = [
    "omfiles>=1.2.0",
    "s3fs>=2026.9.0",
]
gefs = [
    "eccodes>=2.50.0",
    "eccodeslib>=2.50.0.33",
]

[project.scripts]
descargar-datos = "illapa_research.descargar:main"
delimitar-quebradas = "illapa_research.quebradas:main"
filtro-quebradas = "illapa_research.filtro:main"
modelo-quebradas = "illapa_research.modelo_quebradas:main"
analogos-informe = "illapa_research.analogos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/illapa_research"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
